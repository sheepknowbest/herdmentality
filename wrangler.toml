name = "herdmentality"
main = "src/index.ts"
compatibility_date = "2024-04-05"
assets = { directory = "./public" }

[[d1_databases]]
binding = "DB"
database_name = "herdmentality-db"
database_id = "local-dev-only" # Required field, arbitrary value for local dev

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "herdmentality-images"
