<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - SheepKnowBest</title>
  <style>
    :root {
      --charcoal: #333333;
      --soft-gold: #D4AF37;
      --off-white: #F9F9F9;
      --white: #FFFFFF;
      --light-gray: #E0E0E0;
    }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--off-white);
      color: var(--charcoal);
      padding: 2rem;
      margin: 0;
    }
    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--white);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--charcoal);
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: #555;
    }
    input[type="text"],
    input[type="number"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--light-gray);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--soft-gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background-color: var(--charcoal);
      color: var(--white);
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 1rem;
    }
    .submit-btn:hover {
      background-color: #000;
    }
    .submit-btn:active {
      transform: scale(0.98);
    }
    .submit-btn:disabled {
      background-color: var(--gray);
      cursor: not-allowed;
    }
    .message {
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 6px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>🐑 Product Publisher</h1>
    
    <div id="statusMessage" class="message"></div>

    <form id="productForm">
      <div class="form-group">
        <label for="adminPassword">Admin Password</label>
        <input type="password" id="adminPassword" placeholder="Enter super secret password..." required>
      </div>

      <div class="form-group">
        <label for="image">Upload Product Image</label>
        <input type="file" id="image" name="image" accept="image/*" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="e.g., Gaming" required>
      </div>

      <div class="form-group">
        <label for="subCategory">Sub-Category</label>
        <input type="text" id="subCategory" name="subCategory" placeholder="e.g., MMO Mice" required>
      </div>

      <div class="form-group">
        <label for="productName">Product Name</label>
        <input type="text" id="productName" name="productName" placeholder="e.g., Razer Naga V2 Pro" required>
      </div>

      <div class="form-group">
        <label for="reviewCount">Amazon Review Count</label>
        <input type="number" id="reviewCount" name="reviewCount" placeholder="e.g., 1452" required>
      </div>

      <div class="form-group">
        <label for="affiliateLink">Amazon Affiliate Link</label>
        <input type="text" id="affiliateLink" name="affiliateLink" placeholder="https://amazon.com/..." required>
      </div>

      <div class="form-group">
        <label for="sheepTake" style="display:flex; justify-content:space-between; align-items:center;">
          The Sheep's Take
          <button type="button" id="generateBtn" style="padding: 0.3rem 0.6rem; background: #e8e8e8; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">✨ Auto-Generate with Gemini</button>
        </label>
        <textarea id="sheepTake" name="sheepTake" placeholder="Why is this product the Herd Leader?..." required></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Publish to Site</button>
    </form>
  </div>

  <script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const productName = document.getElementById('productName').value;
      const category = document.getElementById('category').value;
      const adminPassword = document.getElementById('adminPassword').value;
      const sheepTake = document.getElementById('sheepTake');
      const genBtn = document.getElementById('generateBtn');

      if (!productName || !category) {
        alert("Please fill in Category and Product Name first.");
        return;
      }
      if (!adminPassword) {
        alert("Please enter the Admin Password at the top.");
        return;
      }

      genBtn.textContent = "⏳ Generating...";
      genBtn.disabled = true;

      try {
        const response = await fetch('/api/admin/generate', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminPassword
          },
          body: JSON.stringify({ 
            productName, 
            category,
            originalText: sheepTake.value
          })
        });

        if (response.status === 401) throw new Error("Invalid password!");
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        
        sheepTake.value = data.text;
      } catch (err) {
        alert("Generation failed: " + err.message);
      } finally {
        genBtn.textContent = "✨ Auto-Generate with Gemini";
        genBtn.disabled = false;
      }
    });

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const form = e.target;
      const btn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('statusMessage');
      const adminPassword = document.getElementById('adminPassword').value;
      
      const formData = new FormData(form);
      
      btn.disabled = true;
      btn.textContent = 'Uploading & Publishing...';
      statusDiv.style.display = 'none';

      try {
        const response = await fetch('/api/admin/products', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + adminPassword
          },
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusDiv.className = 'message success';
          statusDiv.textContent = result.message;
          statusDiv.style.display = 'block';
          form.reset();
        } else {
          throw new Error(result.error || 'Unknown error occurred.');
        }
      } catch (err) {
        statusDiv.className = 'message error';
        statusDiv.textContent = 'Error: ' + err.message;
        statusDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish to Site';
      }
    });
  </script>
</body>
</html>
