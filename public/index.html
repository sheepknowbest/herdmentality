<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SheepKnowBest</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.png">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="SheepKnowBest Logo" class="logo-img">
      <h1>SheepKnowBest</h1>
    </div>
  </header>
  
  <div class="disclosure-container">
    <p class="disclosure-text">
      SheepKnowBest is reader-supported. When you buy through links on our site, we may earn an affiliate commission.
    </p>
  </div>

  <main>
    <div id="product-grid" class="grid-container">
      <!-- Product cards will be dynamically injected here by main.js -->
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
